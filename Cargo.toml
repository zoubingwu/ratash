[package]
name = "ratash"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ratash"
path = "src/main.rs"

[features]
default = []
local-unsigned = []

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httparse = "1"
mio = { version = "1", features = ["net", "os-poll"] }
nix = { version = "0.31.3", features = ["fs", "poll", "signal", "socket", "user"] }
percent-encoding = "2"
ratatui = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
socket2 = "0.6.5"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1.24", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = "3.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
large_enum_variant = "warn"
needless_collect = "warn"
redundant_clone = "warn"

[dev-dependencies]
clap_complete = "4"
clap_mangen = "0.2"
portable-pty = "0.9"
