name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Validate the release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${GITHUB_REF_NAME#v}
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$version" = "$manifest_version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo run --locked --example generate-release-assets -- --check
      - name: Enforce the approved resource benchmark gate
        run: cargo run --locked --release --example release-benchmark -- validate fixtures/release/benchmark-metadata-v1.json --require-approved
      - name: Build Hopash RS
        run: cargo build --locked --release --no-default-features --target "${{ matrix.target }}"
      - name: Download and verify the pinned Mihomo Core
        shell: bash
        run: |
          set -euo pipefail
          url=$(jq -r '.targets["${{ matrix.target }}"].url' packaging/macos/package-contract-v1.json)
          expected=$(jq -r '.targets["${{ matrix.target }}"].sha256' packaging/macos/package-contract-v1.json)
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$url" --output "$RUNNER_TEMP/mihomo.gz"
          actual=$(shasum -a 256 "$RUNNER_TEMP/mihomo.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          gzip -dc "$RUNNER_TEMP/mihomo.gz" >"$RUNNER_TEMP/mihomo"
          chmod 0755 "$RUNNER_TEMP/mihomo"
      - name: Import Apple signing identities
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/hopash-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | /usr/bin/base64 -D >"$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Download the Mihomo license
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/MetaCubeX/mihomo/v1.19.28/LICENSE' \
            --output "$RUNNER_TEMP/Mihomo-GPL-3.0.txt"
      - name: Download and verify the pinned Geo data
        shell: bash
        run: |
          set -euo pipefail
          manifest='fixtures/mihomo/v1.19.28/geodata-manifest.json'
          geodata_directory="$RUNNER_TEMP/geodata"
          mkdir -p "$geodata_directory"
          test "$(jq -r '.assets | length' "$manifest")" = '4'
          for index in 0 1 2 3; do
            file_name=$(jq -r ".assets[$index].file_name" "$manifest")
            url=$(jq -r ".assets[$index].url" "$manifest")
            expected_size=$(jq -r ".assets[$index].size" "$manifest")
            expected_sha256=$(jq -r ".assets[$index].sha256" "$manifest")
            destination="$geodata_directory/$file_name"
            curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "$url" --output "$destination"
            test "$(stat -f '%z' "$destination")" = "$expected_size"
            test "$(shasum -a 256 "$destination" | awk '{print $1}')" = "$expected_sha256"
          done
          source_commit=$(jq -r '.source_commit' "$manifest")
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/$source_commit/LICENSE" \
            --output "$RUNNER_TEMP/MetaCubeX-meta-rules-dat-GPL-3.0.txt"
      - name: Validate the pinned Geo data with Mihomo
        shell: bash
        run: ./scripts/validate-pinned-mihomo-geodata.sh "$RUNNER_TEMP/mihomo" "$RUNNER_TEMP/geodata"
      - name: Build the signed installer
        env:
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLICATION_IDENTITY"
          test -n "$INSTALLER_IDENTITY"
          unset HOPASH_TEST_ALLOW_CUSTOM_GEODATA_MANIFEST
          mkdir -p dist
          ./scripts/package-macos.sh \
            --version '${{ steps.release.outputs.version }}' \
            --target '${{ matrix.target }}' \
            --hopash 'target/${{ matrix.target }}/release/hopash' \
            --mihomo "$RUNNER_TEMP/mihomo" \
            --mihomo-sha256 "$(shasum -a 256 "$RUNNER_TEMP/mihomo" | awk '{print $1}')" \
            --mihomo-license "$RUNNER_TEMP/Mihomo-GPL-3.0.txt" \
            --geodata-directory "$RUNNER_TEMP/geodata" \
            --geodata-manifest 'fixtures/mihomo/v1.19.28/geodata-manifest.json' \
            --geodata-license "$RUNNER_TEMP/MetaCubeX-meta-rules-dat-GPL-3.0.txt" \
            --application-identity "$APPLICATION_IDENTITY" \
            --installer-identity "$INSTALLER_IDENTITY" \
            --output dist
      - name: Notarize and staple the installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          package="dist/hopash-${{ steps.release.outputs.version }}-${{ matrix.target }}.pkg"
          xcrun notarytool submit "$package" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$package"
          pkgutil --check-signature "$package"
          spctl --assess --type install --verbose "$package"
          (
            cd dist
            shasum -a 256 "$(basename "$package")" >"$(basename "$package").sha256"
          )
      - name: Record artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          wrapper_bytes=$(stat -f '%z' 'target/${{ matrix.target }}/release/hopash')
          jq \
            --arg target '${{ matrix.target }}' \
            --argjson wrapper_binary_bytes "$wrapper_bytes" \
            '. + {target: $target} | .measurements.wrapper_binary_bytes = $wrapper_binary_bytes' \
            fixtures/release/benchmark-metadata-v1.json \
            >"dist/benchmark-metadata-${{ matrix.target }}.json"
          target/release/examples/release-benchmark validate \
            "dist/benchmark-metadata-${{ matrix.target }}.json" \
            --require-approved
          cp fixtures/release/product-contract-v1.json dist/
          cp packaging/macos/package-contract-v1.json dist/
          cp fixtures/mihomo/v1.19.28/geodata-manifest.json dist/
      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          name: hopash-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          pattern: hopash-*
          path: dist
          merge-multiple: true
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## macOS installers'
            echo
            for package in dist/*.pkg; do
              bytes=$(stat -c '%s' "$package")
              echo "- $(basename "$package"): $bytes bytes"
            done
            echo
            echo 'Each installer contains the same signed Hopash executable for the public CLI, Supervisor, and privileged service entry points. Per-target binary size and the approved versioned resource benchmark results are attached as benchmark metadata.'
          } >release-notes.md
      - name: Publish the corresponding GPL sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            'https://github.com/MetaCubeX/mihomo/archive/refs/tags/v1.19.28.tar.gz' \
            --output 'dist/mihomo-v1.19.28-source.tar.gz'
          (
            cd dist
            sha256sum mihomo-v1.19.28-source.tar.gz >mihomo-v1.19.28-source.tar.gz.sha256
          )
          geodata_source_commit=$(jq -r '.source_commit' dist/geodata-manifest.json)
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/MetaCubeX/meta-rules-dat/archive/$geodata_source_commit.tar.gz" \
            --output "dist/meta-rules-dat-$geodata_source_commit-source.tar.gz"
          (
            cd dist
            sha256sum "meta-rules-dat-$geodata_source_commit-source.tar.gz" \
              >"meta-rules-dat-$geodata_source_commit-source.tar.gz.sha256"
          )
      - name: Publish the signed installers
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.pkg
            dist/*.pkg.sha256
            dist/benchmark-metadata-*.json
            dist/product-contract-v1.json
            dist/package-contract-v1.json
            dist/geodata-manifest.json
            dist/mihomo-v1.19.28-source.tar.gz
            dist/mihomo-v1.19.28-source.tar.gz.sha256
            dist/meta-rules-dat-*-source.tar.gz
            dist/meta-rules-dat-*-source.tar.gz.sha256
